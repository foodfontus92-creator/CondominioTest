# =============================================================================
# AccesoLibre - Eclipse Mosquitto 2.0 Configuration (100% On-Premise LAN)
# =============================================================================

# MQTT sobre TCP (ESP32, IoT Simulator, Backend Spring Boot)
listener 1883 0.0.0.0
protocol mqtt

# MQTT sobre WebSockets (opcional para diagnostico / consola en red local)
listener 9001 0.0.0.0
protocol websockets

# Seguridad: autenticacion obligatoria por usuario y contrasena
allow_anonymous false
password_file /mosquitto/config/pwfile

# Persistencia local de sesiones QoS 1 y mensajes retenidos (LWT)
persistence true
persistence_location /mosquitto/data/
autosave_interval 300

# Limites defensivos para red local IoT
max_inflight_messages 40
max_queued_messages 1000
message_size_limit 65536
sys_interval 10

# Logging hacia stdout para observabilidad via docker logs
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
