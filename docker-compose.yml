services:
  postgres:
    image: postgres:16-alpine
    container_name: accesolibre-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-accesolibre}
      POSTGRES_USER: ${POSTGRES_USER:-accesolibre}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-accesolibre_local_dev}
      TZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - accesolibre-net

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: accesolibre-mosquitto
    restart: unless-stopped
    environment:
      MQTT_BACKEND_USER: ${MQTT_BACKEND_USER:-accesolibre_backend}
      MQTT_BACKEND_PASSWORD: ${MQTT_BACKEND_PASSWORD:-mqtt_backend_local_dev}
      MQTT_DEVICE_USER: ${MQTT_DEVICE_USER:-accesolibre_device}
      MQTT_DEVICE_PASSWORD: ${MQTT_DEVICE_PASSWORD:-mqtt_device_local_dev}
      TZ: UTC
    ports:
      - "${MQTT_PORT:-1883}:1883"
      - "${MQTT_WS_PORT:-9001}:9001"
    volumes:
      - mosquitto_auth:/mosquitto/config
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        if [ ! -f /mosquitto/config/pwfile ]; then
          touch /mosquitto/config/pwfile
          chmod 0700 /mosquitto/config/pwfile
          mosquitto_passwd -b /mosquitto/config/pwfile "$$MQTT_BACKEND_USER" "$$MQTT_BACKEND_PASSWORD"
          mosquitto_passwd -b /mosquitto/config/pwfile "$$MQTT_DEVICE_USER" "$$MQTT_DEVICE_PASSWORD"
        fi
        chown mosquitto:mosquitto /mosquitto/config/pwfile
        chmod 0600 /mosquitto/config/pwfile
        exec /docker-entrypoint.sh /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mosquitto_sub -h 127.0.0.1 -p 1883 -u \"$$MQTT_BACKEND_USER\" -P \"$$MQTT_BACKEND_PASSWORD\" -t '$$SYS/broker/uptime' -C 1 -W 3 >/dev/null 2>&1"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - accesolibre-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: accesolibre-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-accesolibre}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-accesolibre}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-accesolibre_local_dev}
      SPRING_FLYWAY_ENABLED: "true"
      ACCESOLIBRE_MQTT_BROKER_URL: tcp://mosquitto:1883
      ACCESOLIBRE_MQTT_USERNAME: ${MQTT_BACKEND_USER:-accesolibre_backend}
      ACCESOLIBRE_MQTT_PASSWORD: ${MQTT_BACKEND_PASSWORD:-mqtt_backend_local_dev}
      ACCESOLIBRE_MQTT_CLIENT_ID: accesolibre-backend
      ACCESOLIBRE_SECURITY_JWT_SECRET: ${JWT_SECRET:-9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://accesolibre.fodtech.cl,http://192.168.1.10:3005,http://localhost:3005}
      TZ: UTC
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - accesolibre-net

  web-admin:
    build:
      context: ./web-admin
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api-accesolibre.fodtech.cl}
    container_name: accesolibre-web-admin
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_API_URL: ${VITE_API_URL:-https://api-accesolibre.fodtech.cl}
    ports:
      - "${WEB_ADMIN_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/healthz >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - accesolibre-net

volumes:
  postgres_data:
    name: accesolibre_postgres_data
  mosquitto_auth:
    name: accesolibre_mosquitto_auth
  mosquitto_data:
    name: accesolibre_mosquitto_data
  mosquitto_log:
    name: accesolibre_mosquitto_log

networks:
  accesolibre-net:
    name: accesolibre-net
    driver: bridge
